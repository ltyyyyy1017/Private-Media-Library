<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>映屿 · 私人媒体库</title><link rel="stylesheet" href="/assets/video-js.min.css"><link rel="stylesheet" href="/assets/library.css"></head><body>
<header><a class="brand" href="/">▣ 映屿 <small>私人媒体库</small></a><input id="search" placeholder="搜索全库名称或路径…" aria-label="搜索"><span class="secure">● 热点私享</span><button id="logout">退出</button></header>
<aside><p class="muted">我的空间</p><nav id="nav"><button data-type="all" class="active">▦ 全部文件</button></nav><div class="side-note">只属于你的放映时光。<br><br>文件保存在电脑<br>通过热点加密访问</div></aside>
<main><section class="hero"><div><span class="eyebrow">YOUR PERSONAL COLLECTION</span><h1>把喜欢的，留在这里。</h1><p>一段影像，一组照片，一本还没读完的小说。</p></div><div class="hero-art">▤ <b>▷</b> ▧</div></section>
<div class="toolbar"><div><h2 id="heading">全部文件</h2><div id="crumb"></div></div><div class="actions"><select id="sort" aria-label="排序"><option value="name">名称排序</option><option value="new">最近修改</option><option value="size">文件大小</option></select><button id="mkdir">＋ 新建文件夹</button><button class="primary" id="uploadButton">↑ 上传文件</button><input hidden type="file" id="upload" multiple></div></div>
<div id="uploadStatus" hidden><span id="uploadText"></span><progress id="progress" max="100"></progress></div><p class="muted" id="count"></p><section id="grid" class="grid"></section><div id="empty" hidden>这里还没有内容<br><small>上传文件，或试试其他标签。也可以把文件拖到页面。</small></div></main>
<dialog id="login"><form id="loginForm"><div class="brand">▣ 映屿</div><h2>欢迎回到你的媒体库</h2><p class="muted">连接电脑热点，输入管理面板中设置的密码。</p><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required><button class="primary">进入媒体库 →</button><p id="loginError"></p></form></dialog>
<dialog id="viewer"><div class="viewer-head"><div><small id="mediaType"></small><h2 id="title"></h2></div><button id="close">✕ 关闭</button></div><div id="stage"></div><div class="viewer-actions"><button id="prev">← 上一个</button><button id="next">下一个 →</button><a id="download">↓ 下载原文件</a><button id="rename">重命名</button></div><p id="mediaHint" class="muted"></p></dialog>
<div id="toast" role="status" hidden></div><link rel="stylesheet" href="/assets/features.css"><link rel="stylesheet" href="/assets/mobile.css"><script src="/assets/video.min.js"></script><script src="/assets/library.js"></script><script src="/assets/features.js"></script><script src="/assets/mobile.js"></script><script src="/assets/batch.js"></script><script src="/assets/images.js"></script><link rel="stylesheet" href="/assets/organize.css"><script src="/assets/organize.js"></script><script src="/assets/tags.js"></script></body></html>
